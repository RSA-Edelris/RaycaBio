*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0f0f1a;
  --panel: #1a1a2e;
  --panel2: #16213e;
  --border: #2a2a4a;
  --text: #e2e8f0;
  --sub: #94a3b8;
  --accent: #6366f1;
}

body {
  display: flex; height: 100vh; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  font-size: 13px;
}

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar {
  width: 270px; min-width: 270px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow-y: auto;
}

#sidebar-header {
  padding: 16px 14px 12px;
  border-bottom: 1px solid var(--border);
}
#sidebar-header h1 {
  font-size: 14px; font-weight: 600; letter-spacing: 0.02em;
  color: #a5b4fc;
}
#sidebar-header p {
  margin-top: 3px; font-size: 11px; color: var(--sub);
}

.section-label {
  padding: 10px 14px 4px;
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--sub);
}

/* ── Compound cards ──────────────────────────────────────────── */
.compound-card {
  margin: 4px 8px;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  background: var(--panel2);
}
.compound-card:hover {
  border-color: #4a4a7a;
  background: #1e2040;
}
.compound-card.active {
  border-color: var(--card-color, #6366f1);
  background: color-mix(in srgb, var(--card-color, #6366f1) 12%, var(--panel2));
}

.card-header {
  display: flex; align-items: center; gap: 8px; margin-bottom: 7px;
}
.color-dot {
  width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
}
.card-name {
  font-size: 12px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.stereo-badge {
  font-size: 10px; color: var(--sub); flex-shrink: 0;
}
.best-badge {
  font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
  background: #10b981; color: #fff;
  padding: 1px 5px; border-radius: 4px; flex-shrink: 0;
}

.score-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  gap: 4px;
}
.score-cell {
  background: rgba(0,0,0,0.25);
  border-radius: 5px;
  padding: 4px 5px;
  text-align: center;
}
.score-label { font-size: 9px; color: var(--sub); margin-bottom: 2px; }
.score-val {
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums;
}
.score-val.neg { color: #34d399; }
.score-val.pos { color: #f87171; }
.score-val.mid { color: #93c5fd; }

/* ── Main viewer area ────────────────────────────────────────── */
#main {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
}

#viewer-wrap {
  flex: 1; position: relative; overflow: hidden;
}
#viewer {
  position: absolute; inset: 0;
}

/* ── Controls bar ────────────────────────────────────────────── */
#controls {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 8px 14px;
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}

.ctrl-group {
  display: flex; align-items: center; gap: 6px;
}
.ctrl-label {
  font-size: 10px; font-weight: 600; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--sub);
}

.btn {
  padding: 4px 10px; font-size: 12px; font-weight: 500;
  border-radius: 5px; border: 1px solid var(--border);
  background: var(--panel2); color: var(--text);
  cursor: pointer; transition: all 0.12s;
  font-family: inherit;
}
.btn:hover { background: #1e2040; border-color: #4a4a7a; }
.btn.active {
  background: var(--accent); border-color: var(--accent);
  color: #fff;
}
.btn.pose-btn { min-width: 30px; text-align: center; padding: 4px 6px; }

#pose-label {
  font-size: 11px; color: var(--sub);
}

.spacer { flex: 1; }

#info-bar {
  font-size: 11px; color: var(--sub);
  white-space: nowrap;
}
</style>

// ── State ──────────────────────────────────────────────────────────────────
let viewer;
let currentCompound = null;
let currentPose     = 0;
let proteinStyle    = 'cartoon';   // 'cartoon' | 'surface'
let showPocket      = true;
let poseModels      = [];
let receptorModel   = null;
let surfaceID       = null;
let crystalModel    = null;
let showCrystal     = true;
let showInteractions = true;

// ── Init viewer ────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const el = document.getElementById('viewer');
  viewer = $3Dmol.createViewer(el, {
    backgroundColor: '#0f0f1a',
    antialias: true,
    defaultcolors: $3Dmol.elementColors.Jmol,
  });

  buildCards();
  loadCompound(COMPOUNDS[3].id);  // default: best compound (1S,2S)
});

// ── Build sidebar cards ────────────────────────────────────────────────────
function buildCards() {
  const list = document.getElementById('card-list');
  COMPOUNDS.forEach(c => {
    const s = SCORES[c.id];
    const isBest = c.id === 'EDS01806218_ent2';
    const div = document.createElement('div');
    div.className = 'compound-card';
    div.id = 'card-' + c.id;
    div.style.setProperty('--card-color', c.color);
    div.innerHTML = `
      <div class="card-header">
        <span class="color-dot" style="background:${c.color}"></span>
        <span class="card-name">${c.parent}</span>
        <span class="stereo-badge">${c.stereo}</span>
        ${isBest ? '<span class="best-badge">BEST</span>' : ''}
      </div>
      <div class="score-grid">
        <div class="score-cell">
          <div class="score-label">Vina</div>
          <div class="score-val neg">${s.vina.toFixed(2)}</div>
        </div>
        <div class="score-cell">
          <div class="score-label">CNN</div>
          <div class="score-val mid">${s.cnn_pose.toFixed(3)}</div>
        </div>
        <div class="score-cell">
          <div class="score-label">ΔG kcal/mol</div>
          <div class="score-val neg">${s.dG.toFixed(2)}</div>
        </div>
      </div>`;
    div.addEventListener('click', () => loadCompound(c.id));
    list.appendChild(div);
  });
}

// ── Load compound ──────────────────────────────────────────────────────────
function loadCompound(cid) {
  currentCompound = cid;
  currentPose     = 0;

  // Update card highlight
  document.querySelectorAll('.compound-card').forEach(el => el.classList.remove('active'));
  const card = document.getElementById('card-' + cid);
  if (card) card.classList.add('active');

  // Update pose buttons
  document.querySelectorAll('.pose-btn').forEach((b, i) => {
    b.classList.toggle('active', i === 0);
  });

  rebuildScene();

  const c = COMPOUNDS.find(x => x.id === cid);
  const s = SCORES[cid];
  document.getElementById('info-bar').textContent =
    `${c.parent} ${c.stereo}  ·  Vina ${s.vina.toFixed(2)} kcal/mol  ·  ΔG ${s.dG.toFixed(2)} kcal/mol`;
}

// ── Rebuild 3D scene ───────────────────────────────────────────────────────
function rebuildScene() {
  viewer.removeAllModels();
  viewer.removeAllSurfaces();
  viewer.removeAllShapes();
  surfaceID    = null;
  poseModels    = [];
  receptorModel  = null;
  crystalModel   = null;

  const c    = COMPOUNDS.find(x => x.id === currentCompound);
  const color = c ? c.color : '#aaaaaa';

  // Receptor
  receptorModel = viewer.addModel(RECEPTOR_PDB, 'pdb');
  viewer.setStyle({model: receptorModel}, {
    cartoon: { color: '#b0b8cc', opacity: 0.85, thickness: 0.4, arrows: true }
  });

  // Pocket residues as sticks
  if (showPocket) applyPocketStyle(CONTACTS[currentCompound]);

  // All 5 poses
  const psdfs = POSES[currentCompound];
  psdfs.forEach((sdf, i) => {
    const m = viewer.addModel(sdf, 'sdf');
    poseModels.push(m);
    const isActive = (i === currentPose);
    viewer.setStyle({model: m}, {
      stick: {
        colorscheme: 'default',
        color: color,
        radius: isActive ? 0.18 : 0.10,
        opacity: isActive ? 1.0 : 0.15,
      },

    });
  });

  // Surface if requested
  if (proteinStyle === 'surface') {
    surfaceID = viewer.addSurface(
      $3Dmol.SurfaceType.VDW,
      { opacity: 0.35, colorscheme: 'whiteCarbon' },
      { model: receptorModel }
    );
  }

  // Crystal reference ligand
  if (showCrystal) {
    crystalModel = viewer.addModel(CRYSTAL_LVY_PDB, 'pdb');
    viewer.setStyle({model: crystalModel}, {
      stick: { color: '#ffffff', radius: 0.12, opacity: 0.70 },
    });
  }

  viewer.zoomTo({model: poseModels[0]}, 1000);
  if (currentCompound && INTERACTIONS[currentCompound]) {
    drawInteractions(INTERACTIONS[currentCompound]);
  }
  viewer.render();
}


// ── Draw interaction lines ────────────────────────────────────────────────
function drawInteractions(data) {
  viewer.removeAllShapes();
  if (!showInteractions || !data) return;

  // H-bonds: dashed cyan lines
  (data.hbonds || []).forEach(hb => {
    viewer.addLine({
      start: hb.start, end: hb.end,
      color: '#06b6d4', dashed: true, linewidth: 2
    });
    const mid = {
      x: (hb.start.x + hb.end.x) / 2,
      y: (hb.start.y + hb.end.y) / 2,
      z: (hb.start.z + hb.end.z) / 2
    };
    const d = Math.sqrt(
      Math.pow(hb.end.x - hb.start.x, 2) +
      Math.pow(hb.end.y - hb.start.y, 2) +
      Math.pow(hb.end.z - hb.start.z, 2)
    ).toFixed(1);
    viewer.addLabel(hb.label + ' ' + d + 'Å', {
      position: mid, fontSize: 9, fontColor: '#06b6d4',
      backgroundColor: 'transparent', showBackground: false,
      alignment: 'center'
    });
  });

  // pi-stacking: solid purple cylinders
  (data.pistack || []).forEach(ps => {
    viewer.addCylinder({
      start: ps.start, end: ps.end,
      radius: 0.12, color: '#c026d3', opacity: 0.8,
      dashed: false, fromCap: 1, toCap: 1
    });
    const mid = {
      x: (ps.start.x + ps.end.x) / 2,
      y: (ps.start.y + ps.end.y) / 2,
      z: (ps.start.z + ps.end.z) / 2
    };
    viewer.addLabel(ps.label, {
      position: mid, fontSize: 9, fontColor: '#c026d3',
      backgroundColor: 'transparent', showBackground: false,
      alignment: 'center'
    });
  });

  viewer.render();
}

function toggleInteractions() {
  showInteractions = !showInteractions;
  document.getElementById('btn-interactions').classList.toggle('active', showInteractions);
  drawInteractions(currentCompound ? INTERACTIONS[currentCompound] : null);
}

// ── Pocket residues style (dynamic per-compound) ──────────────────────────
function applyPocketStyle(contactData) {
  if (!receptorModel || !contactData) return;
  const resiList = contactData.resi;
  const trpList  = contactData.trp;

  // All contacts as CPK sticks
  viewer.setStyle(
    {model: receptorModel, resi: resiList},
    {
      cartoon: { color: '#b0b8cc', opacity: 0.85, thickness: 0.4 },
      stick:   { colorscheme: 'Jmol', radius: 0.15, opacity: 0.9 }
    }
  );
  // TRP basket — slightly larger, full opacity
  if (trpList.length > 0) {
    viewer.setStyle(
      {model: receptorModel, resi: trpList},
      {
        cartoon: { color: '#b0b8cc', opacity: 0.85, thickness: 0.4 },
        stick:   { colorscheme: 'Jmol', radius: 0.20, opacity: 1.0 }
      }
    );
  }
  // Labels for all contacts
  contactData.labels.forEach(([resn, resi]) => {
    const isTrp = trpList.includes(resi);
    viewer.addLabel(`${resn} ${resi}`, {
      fontSize: isTrp ? 11 : 9,
      fontColor: isTrp ? '#fde68a' : '#cbd5e1',
      backgroundColor: '#00000099',
      backgroundOpacity: 0.6,
      showBackground: true,
      bold: isTrp,
      inFront: true,
    }, {resi: [resi], model: receptorModel, atom: 'CA'});
  });

  // Crystal-unique contacts (in lighter style when LVY ref is visible)
  if (showCrystal && CONTACTS.crystal_lvy) {
    const crystalOnly = CONTACTS.crystal_lvy.resi.filter(r => !resiList.includes(r));
    if (crystalOnly.length > 0) {
      viewer.setStyle(
        {model: receptorModel, resi: crystalOnly},
        {
          cartoon: { color: '#b0b8cc', opacity: 0.85, thickness: 0.4 },
          stick:   { colorscheme: 'Jmol', radius: 0.12, opacity: 0.55 }
        }
      );
      crystalOnly.forEach(r => {
        const entry = CONTACTS.crystal_lvy.labels.find(([n, ri]) => ri === r);
        if (entry) {
          viewer.addLabel(`${entry[0]} ${entry[1]}`, {
            fontSize: 8, fontColor: '#94a3b8',
            backgroundColor: '#00000088', backgroundOpacity: 0.55,
            showBackground: true, inFront: true,
          }, {resi: [r], model: receptorModel, atom: 'CA'});
        }
      });
    }
  }
}

// ── Select pose ────────────────────────────────────────────────────────────
function selectPose(idx) {
  currentPose = idx;
  document.querySelectorAll('.pose-btn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });

  const c     = COMPOUNDS.find(x => x.id === currentCompound);
  const color  = c ? c.color : '#aaaaaa';

  poseModels.forEach((m, i) => {
    const isActive = (i === idx);
    viewer.setStyle({model: m}, {
      stick: {
        colorscheme: 'default',
        color: color,
        radius: isActive ? 0.18 : 0.10,
        opacity: isActive ? 1.0 : 0.15,
      },

    });
  });

  viewer.zoomTo({model: poseModels[idx]}, 500);
  viewer.render();
}

// ── Protein display style ──────────────────────────────────────────────────
function setProteinStyle(mode) {
  proteinStyle = mode;
  document.getElementById('btn-cartoon').classList.toggle('active', mode === 'cartoon');
  document.getElementById('btn-surface').classList.toggle('active', mode === 'surface');

  if (mode === 'surface') {
    if (surfaceID === null && receptorModel) {
      surfaceID = viewer.addSurface(
        $3Dmol.SurfaceType.VDW,
        { opacity: 0.35, colorscheme: 'whiteCarbon' },
        { model: receptorModel }
      );
    }
  } else {
    if (surfaceID !== null) {
      viewer.removeSurface(surfaceID);
      surfaceID = null;
    }
  }
  viewer.render();
}

// ── Toggle pocket residues ─────────────────────────────────────────────────
function togglePocket() {
  showPocket = !showPocket;
  document.getElementById('btn-pocket').classList.toggle('active', showPocket);
  viewer.removeAllLabels();

  if (!receptorModel) return;

  if (showPocket) {
    applyPocketStyle(CONTACTS[currentCompound]);
  } else {
    const allResi = currentCompound
      ? [...new Set([
          ...(CONTACTS[currentCompound]?.resi || []),
          ...(showCrystal ? CONTACTS.crystal_lvy.resi : [])
        ])]
      : [];
    viewer.setStyle(
      {model: receptorModel, resi: allResi},
      {cartoon: { color: '#b0b8cc', opacity: 0.85, thickness: 0.4 }}
    );
  }
  viewer.render();
}

// ── Toggle crystal ligand ──────────────────────────────────────────────────
function toggleCrystal() {
  showCrystal = !showCrystal;
  document.getElementById('btn-crystal').classList.toggle('active', showCrystal);

  if (showCrystal) {
    if (crystalModel === null) {
      crystalModel = viewer.addModel(CRYSTAL_LVY_PDB, 'pdb');
      viewer.setStyle({model: crystalModel}, {
        stick: { color: '#ffffff', radius: 0.12, opacity: 0.70 },
      });
    }
    // Refresh pocket to include crystal-unique contacts
    if (showPocket && currentCompound) {
      viewer.removeAllLabels();
      applyPocketStyle(CONTACTS[currentCompound]);
    }
  } else {
    if (crystalModel !== null) {
      viewer.removeModel(crystalModel);
      crystalModel = null;
    }
    // Remove crystal-unique contact sticks/labels
    if (showPocket && currentCompound) {
      viewer.removeAllLabels();
      applyPocketStyle(CONTACTS[currentCompound]);
    }
  }
  viewer.render();
}

// ── Reset view ─────────────────────────────────────────────────────────────
function resetView() {
  if (poseModels.length > 0) {
    viewer.zoomTo({model: poseModels[currentPose]}, 600);
    viewer.render();
  }
}
